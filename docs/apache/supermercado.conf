# =============================================================================
#  supermercado.conf — Configuración de Apache HTTP Server para el Laboratorio
#
#  SISTEMA OPERATIVO: Windows 10/11
#  APACHE: Apache Lounge 2.4 (Win64)
#  AUTOR:  Cordero Martin — Servidor web y adaptación de la aplicación
# =============================================================================

Listen 8081

<VirtualHost *:8081>
    ServerName  localhost
    ServerAlias 127.0.0.1

    # Entrega directa de estáticos por Apache (alto rendimiento)
    Alias /static "C:/Users/alejo/OneDrive/Documentos/SEPTIMO SEMESTRE/SEGURIDAD/P1/El-rosado_Phishing/static"

    <Directory "C:/Users/alejo/OneDrive/Documentos/SEPTIMO SEMESTRE/SEGURIDAD/P1/El-rosado_Phishing/static">
        Require all granted
        Options -Indexes
    </Directory>

    # Configuración del Reverse Proxy hacia la aplicación Python (Waitress)
    ProxyPass /static !
    ProxyPass / http://127.0.0.1:5000/
    ProxyPassReverse / http://127.0.0.1:5000/

    # Preserva la cabecera Host original
    ProxyPreserveHost On

    # Registros de acceso y errores del laboratorio
    ErrorLog  "C:/Apache24/logs/supermercado_error.log"
    CustomLog "C:/Apache24/logs/supermercado_access.log" combined

    LogLevel warn
</VirtualHost>

# -----------------------------------------------------------------------------
# OPCIÓN B: mod_wsgi Nativo en Windows (Modo Embebido)
# -----------------------------------------------------------------------------
# NOTA TÉCNICA PARA WINDOWS:
#   En Windows, mod_wsgi NO admite modo daemon (WSGIDaemonProcess).
#   Funciona exclusivamente en modo embebido.
#
# Requiere configurar en httpd.conf:
#   LoadFile "C:/Program Files/WindowsApps/PythonSoftwareFoundation.Python.3.13_.../python313.dll"
#   LoadModule wsgi_module "modules/mod_wsgi.so"
#   WSGIPythonHome "C:/Users/alejo/OneDrive/Documentos/SEPTIMO SEMESTRE/SEGURIDAD/P1/El-rosado_Phishing/.venv"
#
# Ejemplo de VirtualHost mod_wsgi en Windows:
#
# <VirtualHost *:8080>
#     ServerName localhost
#     WSGIScriptAlias / "C:/Users/alejo/OneDrive/Documentos/SEPTIMO SEMESTRE/SEGURIDAD/P1/El-rosado_Phishing/wsgi.py"
#     
#     <Directory "C:/Users/alejo/OneDrive/Documentos/SEPTIMO SEMESTRE/SEGURIDAD/P1/El-rosado_Phishing">
#         <Files wsgi.py>
#             Require all granted
#         </Files>
#     </Directory>
#     
#     Alias /static "C:/Users/alejo/OneDrive/Documentos/SEPTIMO SEMESTRE/SEGURIDAD/P1/El-rosado_Phishing/static"
#     <Directory "C:/Users/alejo/OneDrive/Documentos/SEPTIMO SEMESTRE/SEGURIDAD/P1/El-rosado_Phishing/static">
#         Require all granted
#     </Directory>
#
#     ErrorLog  "C:/Apache24/logs/supermercado_error.log"
#     CustomLog "C:/Apache24/logs/supermercado_access.log" combined
# </VirtualHost>
